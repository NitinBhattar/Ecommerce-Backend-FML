server:
  port: 8083

spring:
  application:
    name: product-service

  cloud:
    config:
      enabled: false

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update

    # Shows SQL query on log when its executed
    show-sql: true


app:
  product:
    image:
      max-size: 5242880

      allowed-types:
        # image is MIME -> Multipurpose Internet Mail Extensions tell jpg is .jpg of image
        - image/jpg
        - image/jpeg
        - image/png
        - image/webp

      allowed-extensions:
        # Extensions
        - jpg
        - jpeg
        - png
        - webp

      upload-dir: uploads/products/

  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION}
    refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL}
