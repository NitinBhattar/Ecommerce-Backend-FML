
services:
  kafka:
    image: apache/kafka:4.4.0
    container_name: kafka
    hostname: kafka
    # Port for client side: broker
    ports:
      - "9092:9092"

    environment:
      # KRaft
      KAFKA_NODE_ID: 1
      # Roles assigned to node, needed for voting of leader that maintains consistent view of cluster metadata
      KAFKA_PROCESS_ROLES: broker, controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Post for kafka's internal working
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # Listeners
      # INTERNAL is same docker network, external is for outside docker network
      KAFKA_LISTENERS: INTERNAL://:29092, EXTERNAL://:9092, CONTROLLER://:9093
      # Open/exposed ports
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092, EXTERNAL://localhost:9092
      # Security policy is TCP communication, like SSL, currently It's nothing
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # Single-broker development settings|
      # Number of replicas
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      # ISR is In-sync replications, syncing data across all replicas
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Time before publishing starts, so that new consumer can join on time
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

      # For cluster identification
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

    # Meta data storage location
    volumes:
      - kafka_data:/var/lib/kafka/data

volumes:
  kafka_data:
